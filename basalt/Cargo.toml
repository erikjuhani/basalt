[package]
name = "basalt-tui"
description = """
Basalt TUI application for Obsidian notes.
"""
readme = "../README.md"
repository = "https://github.com/erikjuhani/basalt"
license = "GPL-3.0-or-later"
version = "0.13.0"
edition = "2021"
rust-version = "1.91.0"
default-run = "basalt"

[dependencies]
basalt-core = { path = "../basalt-core", version = "0.10.0" }
clap = { version = "4.6.1", features = ["derive", "string"] }
ratatui = { version = "0.30.0" }
crossterm = "0.29.0"
pulldown-cmark = "0.13.0"
textwrap = "0.16.2"
serde = { version = "1.0.224", features = ["derive"] }
toml.workspace = true
toml_edit.workspace = true
etcetera = "0.11.0"
thiserror = "2.0.16"
unicode-width = "0.2.0"
natord = "1.0.9"
notify-debouncer-full = "0.7.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
memory-stats = "1.2.0"
tree-sitter = "0.27.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-c = "0.24.2"

[dev-dependencies]
indoc = "=2.0.7"
insta = "=1.48.0"
similar-asserts.workspace = true

[[bin]]
name = "basalt"
path = "src/main.rs"
