name: Nightly

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: check
        shell: bash
        run: |
          if git rev-parse -q --verify refs/tags/nightly >/dev/null \
            && git diff --quiet nightly HEAD -- basalt basalt-core basalt-widgets Cargo.toml Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: nightly
      channel: nightly

  publish:
    name: Publish nightly
    needs: build

    permissions:
      contents: write # Needed to move the nightly tag and update the prerelease

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./release-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Move the nightly tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git tag --force nightly
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            tag nightly

      - name: Publish the nightly prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' basalt/Cargo.toml | cut -d'"' -f2)"
          short_sha="$(git rev-parse --short HEAD)"
          title="Nightly ${version} (${short_sha})"
          notes="Automated build from the latest \`main\` (\`${GITHUB_SHA}\`). Unstable, for testing only."

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "${title}" --notes "${notes}"
            gh release upload nightly ./release-artifacts/* --clobber
          else
            gh release create nightly ./release-artifacts/* \
              --prerelease --title "${title}" --notes "${notes}"
          fi
