name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names (defaults to the tag ref)
        required: false
        type: string
        default: ''
      channel:
        description: Release channel baked into the binary (e.g. nightly)
        required: false
        type: string
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (${{ matrix.target }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linux build tools
        shell: bash
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf \
                                  libc6-dev-armhf-cross \
                                  gcc-aarch64-linux-gnu \
                                  musl-tools \
                                  lld

      - name: Install FreeBSD sysroot
        shell: bash
        if: matrix.target == 'x86_64-unknown-freebsd'
        run: |
          sysroot="${RUNNER_TEMP}/freebsd-sysroot"
          mkdir -p "${sysroot}"
          curl -fsSL https://download.freebsd.org/releases/amd64/14.3-RELEASE/base.txz \
            | tar -xJ -C "${sysroot}" ./lib ./usr/lib ./usr/include
          {
            echo "CC_x86_64_unknown_freebsd=clang"
            echo "CFLAGS_x86_64_unknown_freebsd=--target=x86_64-unknown-freebsd --sysroot=${sysroot}"
            echo "CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=clang"
            echo "CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUSTFLAGS=-C link-arg=--target=x86_64-unknown-freebsd -C link-arg=--sysroot=${sysroot} -C link-arg=-fuse-ld=lld"
          } >> "${GITHUB_ENV}"

      - name: Toolchain
        run: rustup toolchain install

      - name: Add Rust target
        shell: bash
        run: rustup target add "${MATRIX_TARGET}"

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true

      - name: Build binary
        shell: bash
        env:
          BASALT_CHANNEL: ${{ inputs.channel }}
        run: cargo build --locked --release --target "${MATRIX_TARGET}"

      - name: Prepare artifact
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ref_name="${GITHUB_REF_NAME}"
          version="${VERSION:-${ref_name##*/v}}"

          target="${MATRIX_TARGET}"
          bin_path="target/${target}/release"
          staging="basalt-${version}-${target}"
          mkdir -p "${staging}"

          if [ "${MATRIX_OS}" = "windows-latest" ]; then
            cp "${bin_path}/basalt.exe" "${staging}/"
            archive="${staging}.zip"
            7z a "${archive}" "${staging}"
            certutil -hashfile "${archive}" SHA256 > "${archive}.sha256"
          else
            cp "${bin_path}/basalt" "${staging}/"
            archive="${staging}.tar.gz"
            tar -czf "${archive}" "${staging}"
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            basalt-*.tar.gz
            basalt-*.zip
            basalt-*.sha256
          retention-days: 1
