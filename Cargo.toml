[workspace]
members = ["basalt", "basalt-*", "obsidian-to-zola"]
resolver = "2"

[workspace.dependencies]
similar-asserts = "2.0.0"
toml = "1.0.0"
toml_edit = "0.23.6"

[profile.ci]
inherits = "dev"
opt-level = 0

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 3
